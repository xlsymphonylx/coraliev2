[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

[dependencies.sea-orm]
version = "1.1.20"
features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "macros",
]

